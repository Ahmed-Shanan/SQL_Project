<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Average annual salary by data analytics role</title>
  <desc id="desc">Horizontal bar chart comparing seven remote full-time 2023 job postings. Mantys Data Analyst is highest at $650,000.</desc>
  <style>
    .title{font:700 24px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#172033}.sub{font:14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b}.label{font:600 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#25324a}.company{font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b}.tick{font:12px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#64748b}.value{font:700 14px -apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#25324a}.grid{stroke:#dbe3ef;stroke-width:1}.track{fill:#eef2f7}.bar{fill:#356ae6}
  </style>
  <rect width="1000" height="560" fill="#fff"/>
  <text x="40" y="45" class="title">Average annual salary by role</text>
  <text x="40" y="70" class="sub">Remote / anywhere · Full-time roles · 2023 postings</text>
  <line x1="330" y1="105" x2="330" y2="510" class="grid"/><line x1="595" y1="105" x2="595" y2="510" class="grid"/><line x1="860" y1="105" x2="860" y2="510" class="grid"/>
  <text x="330" y="96" text-anchor="middle" class="tick">$0</text><text x="595" y="96" text-anchor="middle" class="tick">$325k</text><text x="860" y="96" text-anchor="middle" class="tick">$650k</text>
  <text x="40" y="125" class="label">Data Analyst</text><text x="40" y="143" class="company">Mantys</text><rect x="330" y="118" width="530" height="27" rx="3" class="track"/><rect x="330" y="118" width="530" height="27" rx="3" class="bar"/><text x="875" y="137" class="value">$650,000</text>
  <text x="40" y="181" class="label">Director of Analytics</text><text x="40" y="199" class="company">Meta</text><rect x="330" y="174" width="530" height="27" rx="3" class="track"/><rect x="330" y="174" width="274" height="27" rx="3" class="bar"/><text x="875" y="193" class="value">$336,500</text>
  <text x="40" y="237" class="label">Associate Director — Data Insights</text><text x="40" y="255" class="company">AT&amp;T</text><rect x="330" y="230" width="530" height="27" rx="3" class="track"/><rect x="330" y="230" width="209" height="27" rx="3" class="bar"/><text x="875" y="249" class="value">$255,830</text>
  <text x="40" y="293" class="label">Data Analyst, Marketing</text><text x="40" y="311" class="company">Pinterest Job Advertisements</text><rect x="330" y="286" width="530" height="27" rx="3" class="track"/><rect x="330" y="286" width="189" height="27" rx="3" class="bar"/><text x="875" y="305" class="value">$232,423</text>
  <text x="40" y="349" class="label">Data Analyst (Hybrid/Remote)</text><text x="40" y="367" class="company">Uclahealthcareers</text><rect x="330" y="342" width="530" height="27" rx="3" class="track"/><rect x="330" y="342" width="177" height="27" rx="3" class="bar"/><text x="875" y="361" class="value">$217,000</text>
  <text x="40" y="405" class="label">Principal Data Analyst (Remote)</text><text x="40" y="423" class="company">SmartAsset</text><rect x="330" y="398" width="530" height="27" rx="3" class="track"/><rect x="330" y="398" width="167" height="27" rx="3" class="bar"/><text x="875" y="417" class="value">$205,000</text>
  <text x="40" y="461" class="label">Director, Data Analyst — Hybrid</text><text x="40" y="479" class="company">Inclusively</text><rect x="330" y="454" width="530" height="27" rx="3" class="track"/><rect x="330" y="454" width="154" height="27" rx="3" class="bar"/><text x="875" y="473" class="value">$189,309</text>
  <line x1="40" y1="520" x2="960" y2="520" class="grid"/><text x="40" y="542" class="sub">Salary values are annual averages stated in the supplied job-posting data.</text>
</svg>
